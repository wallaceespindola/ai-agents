<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="url(#bg)" rx="12"/>
  <rect width="900" height="200" fill="none" stroke="#2e3254" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Agent nodes wired to a hub (decorative, right side) -->
  <g stroke="#2e3254" stroke-width="2">
    <line x1="730" y1="100" x2="650" y2="55"/>
    <line x1="730" y1="100" x2="650" y2="145"/>
    <line x1="730" y1="100" x2="810" y2="55"/>
    <line x1="730" y1="100" x2="810" y2="145"/>
    <line x1="730" y1="100" x2="730" y2="35"/>
    <line x1="730" y1="100" x2="730" y2="165"/>
  </g>
  <circle cx="730" cy="100" r="22" fill="#6c63ff"/>
  <circle cx="650" cy="55" r="12" fill="#00d4aa"/>
  <circle cx="650" cy="145" r="12" fill="#f59e0b"/>
  <circle cx="810" cy="55" r="12" fill="#ef4444"/>
  <circle cx="810" cy="145" r="12" fill="#00d4aa"/>
  <circle cx="730" cy="35" r="10" fill="#f59e0b"/>
  <circle cx="730" cy="165" r="10" fill="#6c63ff"/>

  <text x="48" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff">AI Agents &amp; Skills</text>
  <text x="48" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#a0a4c0">Specialized agents for software engineering, architecture and DevOps</text>
  <text x="48" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00d4aa">github.com/wallaceespindola/ai-agents</text>
</svg>
